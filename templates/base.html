<!doctype html>
<html lang="{{ locale }}" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  {# Sayfa boyanmadan temayı uygular: karanlık açılışta "yanıp sönme" olmaz #}
  <script nonce="{{ csp_nonce() }}">
    (function () {
      var saved = null;
      try { saved = localStorage.getItem("theme"); } catch (e) { /* depolama kapalı */ }
      var dark = saved ? saved === "dark"
        : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
      document.documentElement.setAttribute("data-bs-theme", dark ? "dark" : "light");
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <meta name="description" content="{{ t('app.name') }} - {{ t('app.tagline') }}">
  <title>{% block title %}{{ t('app.name') }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/bootstrap-icons/bootstrap-icons.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {# JS tarafının kullanacağı çeviriler ve ay kısaltmaları #}
  <script nonce="{{ csp_nonce() }}">
    window.I18N = {{ client_strings|tojson }};
    window.I18N_MONTHS = {{ client_months|tojson }};
  </script>
  {% block head %}{% endblock %}
</head>
<body>
  {% block body %}{% endblock %}

  <div class="toast-container position-fixed bottom-0 end-0 p-3" id="toast-stack" aria-live="polite"></div>

  <script src="{{ url_for('static', filename='vendor/bootstrap/bootstrap.bundle.min.js') }}"></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
